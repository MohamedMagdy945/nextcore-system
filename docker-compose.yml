services:

  # =========================================================================
  # 🟦 Catalog API + MongoDB
  # =========================================================================
  catalog.api:
    build:
      context: .
      dockerfile: Services/Catalog/Catalog.API/Dockerfile
    container_name: catalog.api
    ports:
      - "8001:8080"
    depends_on:
      catalogdb:
        condition: service_healthy
      # elasticsearch:
      #   condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      DatabaseSettings__ConnectionString: mongodb://catalogdb:27017
      DatabaseSettings__DatabaseName: CatalogDb
      DatabaseSettings__BrandsCollection: Brands
      DatabaseSettings__CategoriesCollection: Categories
      DatabaseSettings__ProductsCollection: Products
      ElasticConfiguration__Uri: http://elasticsearch:9200
    networks:
      - app-network

  catalogdb:
    image: mongo:8.0
    container_name: catalogdb
    ports:
      - "27017:27017"
    volumes:
      - catalogdata:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  # =========================================================================
  # 🟩 Basket API + Redis
  # =========================================================================
  basket.api:
    build:
      context: .
      dockerfile: Services/Basket/Basket.API/Dockerfile
    container_name: basket.api
    ports:
      - "8002:8080"
    depends_on:
      basketdb:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      # elasticsearch:
      #   condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      CacheSettings__ConnectionString: basketdb:6379
      GrpcSettings__DiscountUrl: http://discount.api:8080
      EventBusSettings__Host: rabbitmq
      EventBusSettings__Port: 5672
      EventBusSettings__Username: guest
      EventBusSettings__Password: guest
      ElasticConfiguration__Uri: http://elasticsearch:9200
    networks:
      - app-network

  basketdb:
    image: redis:7.4-alpine
    container_name: basketdb
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - app-network

  # =========================================================================
  # 🟨 Discount API + PostgreSQL
  # =========================================================================
  discount.api:
    build:
      context: .
      dockerfile: Services/Discount/Discount.API/Dockerfile
    container_name: discount.api
    ports:
      - "8003:8080"
    depends_on:
      discountdb:
        condition: service_healthy
      # elasticsearch:
      #   condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      DatabaseSettings__ConnectionString: Host=discountdb;Port=5432;Database=discountdb;Username=admin;Password=Password@1
      ElasticConfiguration__Uri: http://elasticsearch:9200
    networks:
      - app-network

  discountdb:
    image: postgres:17-alpine
    container_name: discountdb
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: Password@1
      POSTGRES_DB: discountdb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d discountdb"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  # =========================================================================
  # 🟧 Ordering API + SQL Server
  # =========================================================================
  ordering.api:
    build:
      context: .
      dockerfile: Services/Ordering/Ordering.API/Dockerfile
    container_name: ordering.api
    ports:
      - "8004:8080"
    depends_on:
      orderdb:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      # elasticsearch:
      #   condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__OrderingConnectionString: Server=orderdb;Database=orderDb;User Id=sa;Password=P@ssw0rd123;TrustServerCertificate=True;
      EventBusSettings__Host: rabbitmq
      EventBusSettings__Port: 5672
      EventBusSettings__Username: guest
      EventBusSettings__Password: guest
      ElasticConfiguration__Uri: http://elasticsearch:9200
    networks:
      - app-network

  orderdb:
    image: mcr.microsoft.com/mssql/server:2022-CU15-ubuntu-22.04
    container_name: orderdb
    environment:
      ACCEPT_EULA: "Y"
      SA_PASSWORD: "P@ssw0rd123"
    ports:
      - "1433:1433"
    volumes:
      - orderdb_data:/var/opt/mssql
    healthcheck:
      test: ["CMD", "/opt/mssql-tools18/bin/sqlcmd", "-S", "localhost", "-U", "sa", "-P", "P@ssw0rd123", "-Q", "SELECT 1", "-C"]
      interval: 15s
      timeout: 10s
      retries: 5
    networks:
      - app-network

  # =========================================================================
  # 🛠️  Auth Service + SQL Server
  # =========================================================================
  
  auth.api:
    image: ${DOCKER_REGISTRY-}authapi
    build:
      context: .
      dockerfile: Services/Auth/Auth.API/Dockerfile
    container_name: auth.api
    ports:
      - "8010:8080"
    depends_on:
      authdb:
        condition: service_healthy
      # elasticsearch:
      #   condition: service_healthy
      seq:
        condition: service_started
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: Server=authdb,1433;Database=authDb;User Id=sa;Password=P@ssw0rd123;TrustServerCertificate=True;
      LoggingOptions__SeqUrl: http://seq:5341
      LoggingOptions__ElasticsearchUrl: http://elasticsearch:9200
      LoggingOptions__UseConsole: true
      LoggingOptions__UseSeq: true
      LoggingOptions__UseElasticsearch: false
    networks:
      - app-network

  authdb:
    image: mcr.microsoft.com/mssql/server:2022-CU15-ubuntu-22.04
    container_name: authdb
    environment:
      ACCEPT_EULA: "Y"
      SA_PASSWORD: "P@ssw0rd123"
    ports:
      - "1434:1433"
    volumes:
      - authdb_data:/var/opt/mssql
    healthcheck:
      test: ["CMD", "/opt/mssql-tools18/bin/sqlcmd", "-S", "localhost", "-U", "sa", "-P", "P@ssw0rd123", "-Q", "SELECT 1", "-C"]
      interval: 15s
      timeout: 10s
      retries: 5
    networks:
      - app-network

  # =========================================================================
  # 🛠️  API Gateway (YARP)
  # =========================================================================

  apigateway:
    image: ${DOCKER_REGISTRY-}apigateway
    build:
      context: .
      dockerfile: Gateway/ApiGateway/Dockerfile
    depends_on:
     seq:
        condition: service_started
     catalog.api:
        condition: service_started
     basket.api:
        condition: service_started
     discount.api:
        condition: service_started
     ordering.api:
        condition: service_started
     auth.api:
        condition: service_started
      
    ports:
      - "8020:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      LoggingOptions__SeqUrl: http://seq:5341 
      LoggingOptions__ElasticsearchUrl: http://elasticsearch:9200
      LoggingOptions__UseConsole: true
      LoggingOptions__UseSeq: true
      LoggingOptions__UseElasticsearch: false
    networks:
      - app-network

  # =========================================================================
  # 📨 RabbitMQ
  # =========================================================================
  rabbitmq:
    image: rabbitmq:4.1-management-alpine
    container_name: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  # =========================================================================
  # 🔎 Elasticsearch + Kibana
  # =========================================================================
  # elasticsearch:
  #   image: docker.elastic.co/elasticsearch/elasticsearch:8.18.1
  #   container_name: elasticsearch
  #   environment:
  #     discovery.type: single-node
  #     xpack.security.enabled: "false"
  #     ES_JAVA_OPTS: -Xms512m -Xmx512m
  #   ports:
  #     - "9200:9200"
  #   volumes:
  #     - elasticsearch-data:/usr/share/elasticsearch/data
  #   healthcheck:
  #     test: ["CMD-SHELL", "curl -s http://localhost:9200/_cluster/health | grep -q '\"status\":\"green\"\\|\"status\":\"yellow\"'"]
  #     interval: 15s
  #     timeout: 10s
  #     retries: 5
  #   networks:
  #     - app-network

  # kibana:
  #   image: docker.elastic.co/kibana/kibana:8.18.1
  #   container_name: kibana
  #   ports:
  #     - "5601:5601"
  #   depends_on:
  #     elasticsearch:
  #       condition: service_healthy
  #   environment:
  #     ELASTICSEARCH_HOSTS: http://elasticsearch:9200
  #   networks:
  #     - app-network

  # =========================================================================
  # 🔎 Seq
  # =========================================================================
  seq:
    image: datalust/seq:latest
    container_name: seq
    ports:
      - "8009:80"
      - "5341:5341"
    environment:
      - ACCEPT_EULA=Y
      - SEQ_FIRSTRUN_NOAUTHENTICATION=true
    networks:
      - app-network
  # =========================================================================
  # 🛠️  (Management Tools)
  # =========================================================================
  
  portainer:
    image: portainer/portainer-ce:2.27.1
    container_name: portainer
    ports:
      - "9000:9000"
    volumes:
      - portainer_data:/data
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - app-network

# =========================================================================
# 📦 Volumes Configuration
# =========================================================================
volumes:
  catalogdata:
  postgres_data:
  pgadmin_data:
  portainer_data:
  orderdb_data:
  authdb_data:
  # elasticsearch-data:

# =========================================================================
# 🌐 Network Configuration
# =========================================================================
networks:
  app-network:
    driver: bridge

